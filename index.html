<!doctype html><html lang='ru'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#dff1ff'><title>Кто ты в РМК?</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;color:#10356d;background:linear-gradient(145deg,#eef9ff,#cfe9ff 45%,#e7f4ff);min-height:100vh;overflow-x:hidden}.orb{position:fixed;border-radius:50%;filter:blur(1px);background:radial-gradient(circle at 30% 25%,#fff9, #65b7ff55 45%,#0a73d222);box-shadow:inset 0 0 25px #fff9,0 20px 50px #4a9de633;pointer-events:none}.o1{width:260px;height:260px;left:-90px;top:-70px}.o2{width:180px;height:180px;right:-55px;top:22%}.o3{width:220px;height:220px;left:8%;bottom:-100px}.app{width:min(680px,100%);margin:auto;padding:24px 18px 40px;min-height:100vh;display:flex;align-items:center;justify-content:center}.glass{width:100%;background:linear-gradient(145deg,#ffffffb8,#ffffff66);border:1px solid #fff;box-shadow:0 24px 70px #287cc62b,inset 0 1px 0 #fff;backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);border-radius:34px;padding:28px}.brand{font-size:13px;font-weight:800;letter-spacing:.08em;color:#2778c8}.hero h1{font-size:clamp(38px,10vw,64px);line-height:.95;margin:28px 0 16px;letter-spacing:-.05em;color:#0b4b9b}.hero p{font-size:18px;line-height:1.5;color:#3f6592}.pill{display:inline-flex;padding:9px 14px;border-radius:999px;background:#ffffff8a;border:1px solid #fff;box-shadow:inset 0 1px 0 #fff,0 8px 20px #448ed51c}.btn{width:100%;border:0;border-radius:22px;padding:17px 20px;font-size:17px;font-weight:750;color:white;background:linear-gradient(180deg,#2997ff,#0876df);box-shadow:inset 0 1px 0 #ffffffb0,0 12px 28px #0876df4d;cursor:pointer;margin-top:24px}.btn.secondary{background:#ffffff91;color:#1767b7;border:1px solid white;box-shadow:inset 0 1px 0 #fff,0 10px 25px #377db426}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.counter{font-size:13px;font-weight:750}.bar{height:8px;background:#ffffffaa;border-radius:99px;overflow:hidden;border:1px solid #fff;flex:1}.fill{height:100%;background:linear-gradient(90deg,#1e8df5,#126bd2);border-radius:99px;transition:.35s}.question{font-size:clamp(26px,7vw,38px);line-height:1.08;letter-spacing:-.035em;color:#103f7f;margin:28px 0}.answers{display:grid;gap:12px}.answer{border:1px solid #fff;background:linear-gradient(145deg,#ffffffcf,#ffffff72);box-shadow:inset 0 1px 0 #fff,0 10px 25px #4a8fc51a;border-radius:20px;padding:17px;text-align:left;color:#174d86;font-size:16px;font-weight:650;cursor:pointer;transition:.18s}.answer:hover{transform:translateY(-2px);box-shadow:0 14px 30px #3b86c72c,inset 0 1px 0 #fff}.result-img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:26px;border:1px solid #fff;box-shadow:0 18px 45px #266da633}.result h1{font-size:clamp(32px,9vw,52px);line-height:.98;letter-spacing:-.045em;margin:20px 0 10px;color:#0b4b9b}.badge{display:inline-flex;padding:8px 13px;border-radius:999px;background:#1687ed;color:white;font-weight:800;font-size:13px;box-shadow:inset 0 1px #ffffff88,0 8px 20px #1687ed44}.desc{font-size:17px;line-height:1.55;color:#365f8d}.super{margin-top:18px;padding:18px;border-radius:22px;background:#ffffff8a;border:1px solid #fff}.super b{display:block;color:#0c559f;margin-bottom:7px}.quote{font-style:italic;margin-top:10px;color:#52759a}.tiny{font-size:13px;color:#6786a8;margin-top:14px;text-align:center}@media(max-width:480px){.app{padding:12px}.glass{padding:22px;border-radius:28px}.hero h1{margin-top:22px}.question{margin:22px 0}.answer{padding:16px}}
</style></head><body><div class='orb o1'></div><div class='orb o2'></div><div class='orb o3'></div><main class='app' id='app'></main><script>
const R={pisman:{name:'Письман Всемкопиевич',img:'pisman.jpeg',desc:'Ты любишь, когда всё зафиксировано и находится на своём месте. Внимательно следишь за перепиской, помнишь о договорённостях и редко пропускаешь важные сообщения.',super:'Держать информационный порядок.',quote:'Если этого нет в переписке — было ли это вообще?'},perekuriy:{name:'Перекурий Пятиминутович',img:'perekuriy.jpeg',desc:'Для тебя работа — это не только задачи, но и люди вокруг. Ты легко находишь общий язык с коллегами, знаешь, что происходит в коллективе, и понимаешь ценность небольшого перерыва посреди рабочего дня.',super:'Коммуникация и умение переключаться.',quote:'Пять минут — понятие относительное.'},divantiy:{name:'Дивантий Удалёнович',img:'divantiy.jpeg',desc:'Ты ценишь самостоятельность и возможность спокойно сосредоточиться на своих задачах. Тебе не обязательно постоянно быть в центре событий: главное — понятная задача и возможность работать в своём темпе.',super:'Автономность.',quote:'На связи — уже достаточно информации о твоём местонахождении.'},pochinislav:{name:'Починислав Работаетыч',img:'pochinislav.jpeg',desc:'Если появляется проблема, ты предпочитаешь не обсуждать её бесконечно, а разобраться и найти решение. Сложные задачи скорее вызывают у тебя интерес, чем желание отложить их на потом.',super:'Превращать «не работает» в «уже работает».',quote:'Инструкцию можно прочитать и после.'},kofentiy:{name:'Кофентий Третьечашевич',img:'kofentiy.jpeg',desc:'Ты любишь привычный рабочий ритм и небольшие ритуалы, которые помогают переключаться между задачами. Не обязательно делать всё в спешке — гораздо важнее войти в нужный темп и спокойно двигаться дальше.',super:'Сохранять рабочий ритм.',quote:'Количество чашек в течение дня официально не фиксируется.'},dudonya:{name:'Дудоня Дедлайнович',img:'dudonya.jpeg',desc:'Чёткий срок действует на тебя лучше любого мотиватора. Чем ближе дедлайн, тем быстрее принимаются решения и тем выше концентрация. Там, где другие начинают нервничать, ты наконец входишь в рабочий темп.',super:'Максимальная концентрация в нужный момент.',quote:'До дедлайна ещё два часа. Времени предостаточно.'},sozvoniy:{name:'Созвоний Пятиминутович',img:'sozvoniy.jpeg',desc:'Ты предпочитаешь решать вопросы через общение. Вместо длинной переписки проще собрать нужных людей, быстро обсудить ситуацию и договориться о дальнейших действиях.',super:'Находить решение вместе с другими.',quote:'«Буквально на пять минут» — начало многих важных разговоров.'},pravkin:{name:'Правкин Последнефиналович',img:'pravkin.jpeg',desc:'Ты внимательно относишься к результату и редко отправляешь работу, не проверив её ещё раз. Даже когда всё уже готово, почти всегда находится деталь, которую можно сделать лучше.',super:'Замечать то, что другие могли пропустить.',quote:'Финальная версия действительно существует. Теоретически.'},vnezapiy:{name:'Внезапий Срочнович',img:'vnezapiy.jpeg',desc:'Ты умеешь быстро перестраиваться, когда планы внезапно меняются. Срочные задачи тебя не парализуют: оцениваешь ситуацию, включаешься и разбираешься с проблемой по ходу дела.',super:'Сохранять эффективность, когда всё пошло не по плану.',quote:'Если ничего не горит — немного непривычно.'},pyatnitslav:{name:'Пятницлав Доживанович',img:'pyatnitslav.jpeg',desc:'Ты предпочитаешь понятный план, нормальный темп и разумное распределение задач. Умеешь оценивать приоритеты и не считаешь, что каждая новая задача автоматически должна становиться срочной.',super:'Беречь порядок и здравый смысл.',quote:'То, что пришло в пятницу в 17:55, иногда действительно может подождать до понедельника.'}};
const Q=[
['С чего обычно начинается твой рабочий день?',[['Проверяю почту и рабочие чаты.',{pisman:2,pravkin:1}],['Беру кофе и постепенно включаюсь в работу.',{kofentiy:2,perekuriy:1}],['Смотрю список задач и сразу начинаю работать.',{pochinislav:2,pyatnitslav:1}],['Общаюсь с коллегами и узнаю, что нового.',{perekuriy:2,sozvoniy:1}]]],
['Приходит длинная переписка по рабочему вопросу. Что делаешь?',[['Внимательно читаю всю цепочку сообщений.',{pisman:2,pravkin:1}],['Просматриваю главное и определяю, что требуется от меня.',{pyatnitslav:2,pochinislav:1}],['Предпочитаю сразу уточнить всё у коллег.',{sozvoniy:2,perekuriy:1}],['Возвращаюсь к ней, когда появляется свободное время.',{divantiy:2,pyatnitslav:1}]]],
['Как тебе удобнее решать рабочие вопросы?',[['В переписке — так всё остаётся зафиксировано.',{pisman:2,pravkin:1}],['Быстро созвониться и обсудить.',{sozvoniy:2,perekuriy:1}],['Разобраться самостоятельно.',{divantiy:2,pochinislav:1}],['Подойти к человеку и поговорить лично.',{perekuriy:2,sozvoniy:1}]]],
['До сдачи задачи осталось три дня. На каком ты этапе?',[['Всё практически готово.',{pyatnitslav:2,pravkin:1}],['Основная часть сделана, осталось немного доработать.',{pravkin:2,pochinislav:1}],['Только начинаю активно заниматься задачей.',{dudonya:2,vnezapiy:1}],['Зависит от задачи — иногда основная работа начинается ближе к сроку.',{dudonya:2,vnezapiy:1}]]],
['Перед отправкой готовой работы ты обычно…',[['Проверяю один раз и отправляю.',{pochinislav:2,pyatnitslav:1}],['Перепроверяю несколько раз.',{pravkin:2,pisman:1}],['Нахожу, что ещё можно улучшить.',{pravkin:2,dudonya:1}],['Отправляю и перехожу к следующей задаче.',{vnezapiy:2,pochinislav:1}]]],
['Появляется неожиданная срочная задача. Твоя реакция?',[['Сразу переключаюсь на неё.',{vnezapiy:2,pochinislav:1}],['Сначала выясняю сроки и приоритет.',{pyatnitslav:2,pisman:1}],['Быстро составляю план действий.',{pochinislav:2,vnezapiy:1}],['Подключаю коллег, если вопрос проще решить вместе.',{sozvoniy:2,perekuriy:1}]]],
['Какой формат работы тебе комфортнее?',[['В офисе.',{perekuriy:2,sozvoniy:1}],['Удалённо.',{divantiy:2,pyatnitslav:1}],['Гибридный формат.',{pyatnitslav:2,divantiy:1}],['Место не имеет значения, если можно спокойно работать.',{divantiy:2,pochinislav:1}]]],
['Что делаешь, если долго не получается решить задачу?',[['Продолжаю разбираться самостоятельно.',{pochinislav:2,divantiy:1}],['Прошу совета у коллеги.',{perekuriy:2,sozvoniy:1}],['Предлагаю вместе обсудить проблему.',{sozvoniy:2,pochinislav:1}],['Ненадолго переключаюсь и возвращаюсь к ней позже.',{kofentiy:2,pyatnitslav:1}]]],
['Как у тебя обычно с перерывами в течение дня?',[['Стараюсь делать небольшие перерывы регулярно.',{pyatnitslav:2,kofentiy:1}],['Могу забыть о них, если увлёкся работой.',{pochinislav:2,vnezapiy:1}],['Перерыв — хороший повод выпить кофе.',{kofentiy:2,perekuriy:1}],['Люблю выйти с коллегами и немного переключиться.',{perekuriy:2,kofentiy:1}]]],
['Пятница, конец рабочего дня. Появляется новая задача. Что делаешь?',[['Если успеваю — сделаю сегодня.',{vnezapiy:2,pochinislav:1}],['Оцениваю срочность и принимаю решение.',{pyatnitslav:2,pisman:1}],['Фиксирую и возвращаюсь к ней в понедельник.',{pyatnitslav:2,divantiy:1}],['Если действительно срочно — подключаюсь сразу.',{vnezapiy:2,dudonya:1}]]],
['Что больше всего похоже на тебя в работе?',[['Люблю, когда всё зафиксировано и ничего не потеряется.',{pisman:2,pravkin:1}],['Мне проще обсудить вопрос с человеком напрямую.',{sozvoniy:2,perekuriy:1}],['Люблю самостоятельно находить решение.',{pochinislav:2,divantiy:1}],['Лучше всего работаю, когда есть чёткий срок.',{dudonya:2,vnezapiy:1}]]],
['Какой рабочий день ты назовёшь хорошим?',[['Когда удалось закрыть много задач.',{pochinislav:2,vnezapiy:1}],['Когда спокойно сделал всё запланированное.',{pyatnitslav:2,kofentiy:1}],['Когда удалось решить сложную проблему.',{pravkin:2,pochinislav:1}],['Когда было много общения и совместной работы.',{sozvoniy:2,perekuriy:1}]]],
['В течение рабочего дня неожиданно появилось 15 свободных минут. Что ты скорее сделаешь?',[['Проверю почту и сообщения.',{pisman:2,pravkin:1}],['Возьму кофе и немного переключусь.',{kofentiy:2,perekuriy:1}],['Закрою небольшую задачу.',{pochinislav:2,vnezapiy:1}],['Сделаю небольшой перерыв.',{perekuriy:2,pyatnitslav:1}]]],
['Что чаще всего заставляет тебя работать быстрее?',[['Чётко поставленная задача.',{pochinislav:2,pisman:1}],['Приближающийся срок.',{dudonya:2,pravkin:1}],['Внезапно появившаяся срочная задача.',{vnezapiy:2,dudonya:1}],['Желание закончить всё заранее.',{pyatnitslav:2,pravkin:1}]]],
['Задача уже готова. Что ты делаешь дальше?',[['Отправляю результат и перехожу к следующей.',{pochinislav:2,vnezapiy:1}],['Ещё раз всё проверяю.',{pravkin:2,pisman:1}],['Сначала обсужу результат с коллегой.',{sozvoniy:2,perekuriy:1}],['Оставлю ненадолго и посмотрю на результат свежим взглядом.',{divantiy:2,kofentiy:1}]]]
];
let i=0,s={};Object.keys(R).forEach(k=>s[k]=0);const app=document.getElementById('app');
function start(){i=0;Object.keys(s).forEach(k=>s[k]=0);renderQ()}
function home(){app.innerHTML=`<section class='glass hero'><div class='brand'>⚓ РМК</div><span class='pill'>РАБОТНИК МЕСЯЦА</span><h1>Кто ты<br>в РМК?</h1><p>15 вопросов, которые определят, какой ты работник месяца. Здесь нет правильных и неправильных ответов — выбирай то, что действительно похоже на тебя.</p><button class='btn' onclick='start()'>Пройти тест →</button><div class='tiny'>10 котов. 15 вопросов. 1 ты.</div></section>`}
function renderQ(){const q=Q[i],pct=((i)/Q.length*100);app.innerHTML=`<section class='glass'><div class='top'><div class='bar'><div class='fill' style='width:${pct}%'></div></div><div class='counter'>${i+1} из ${Q.length}</div></div><div class='brand'>КТО ТЫ В РМК?</div><h2 class='question'>${q[0]}</h2><div class='answers'>${q[1].map((a,n)=>`<button class='answer' onclick='pick(${n})'>${a[0]}</button>`).join('')}</div></section>`}
function pick(n){const pts=Q[i][1][n][1];Object.entries(pts).forEach(([k,v])=>s[k]+=v);i++;if(i<Q.length)renderQ();else result()}
function result(){const order=Object.keys(R);let win=order[0];for(const k of order)if(s[k]>s[win])win=k;const r=R[win];app.innerHTML=`<section class='glass result'><div class='brand'>ТВОЙ РЕЗУЛЬТАТ</div><img class='result-img' src='${r.img}' alt='${r.name}'><div style='margin-top:18px'><span class='badge'>РАБОТНИК МЕСЯЦА</span></div><h1>Ты —<br>${r.name}</h1><p class='desc'>${r.desc}</p><div class='super'><b>Твоя суперсила</b>${r.super}<div class='quote'>${r.quote}</div></div><button class='btn' onclick='shareResult("${r.name.replace(/"/g,'')}")'>Поделиться результатом</button><button class='btn secondary' onclick='start()'>↻ Пройти ещё раз</button></section>`}
async function shareResult(name){const text=`Я — ${name}! А какой ты работник месяца в РМК?`;if(navigator.share){try{await navigator.share({title:'Кто ты в РМК?',text,url:location.href})}catch(e){}}else{try{await navigator.clipboard.writeText(text+' '+location.href);alert('Результат и ссылка скопированы!')}catch(e){alert(text)}}}
home();
</script></body></html>
